[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "icity-exporter"
version = "2.0.0"
description = "Python client for icity.ly — read and write diary entries without a browser"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Luisa Wang", email = "luisa07wang@gmail.com"},
]
keywords = ["icity", "diary", "journal", "api", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/LuisaW07/icity-exporter"
Repository = "https://github.com/LuisaW07/icity-exporter"
Issues = "https://github.com/LuisaW07/icity-exporter/issues"

[tool.setuptools.packages.find]
include = ["icity*"]
